name: Deploy dashboard to GitHub Pages

# Builds web_dashboard as a Next.js static export and publishes it to GitHub
# Pages. The site URL ends up at https://<owner>.github.io/<repo>/, so the
# build injects NEXT_PUBLIC_BASE_PATH=/<repo> for asset URLs.
#
# Repo setup required (one-time):
#   Settings → Pages → "Build and deployment" → Source: "GitHub Actions"
#
# Triggers:
#   - push to develop or main (auto-deploy)
#   - manual via the Actions tab (workflow_dispatch)

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

# Grant the workflow the minimum permissions for Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment may run at a time. New pushes cancel a stale
# in-progress build but never an in-progress *deploy* (we want a deploy that
# has handed off to GitHub's CDN to complete cleanly).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_dashboard/package-lock.json

      - name: Set up Rust toolchain
        # The dashboard's WASM simulator is built from sim_wasm into
        # web_dashboard/public/wasm before npm run build picks it up.
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build sim_wasm
        # Emits to web_dashboard/public/wasm/{sim_wasm.js, sim_wasm_bg.wasm, …}
        # which Next.js copies into the static export as `/wasm/*`.
        run: |
          wasm-pack build sim_wasm \
            --release \
            --target web \
            --out-dir ../web_dashboard/public/wasm

      - name: Configure Pages
        # Reads the repo / owner names and exposes them as `base_path` for
        # downstream steps. We use the output to keep the `basePath`
        # injection in one place.
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dashboard dependencies
        working-directory: web_dashboard
        run: npm ci --no-audit --no-fund

      - name: Build static export
        working-directory: web_dashboard
        env:
          # `actions/configure-pages` outputs `base_path` like "/expanse-sim".
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Default WS endpoint baked into the bundle. The dashboard defaults
          # to the WASM transport, so this is only used if the operator flips
          # the transport toggle to "Server". Override per-deployment via the
          # `NEXT_PUBLIC_DEFAULT_WS_URL` repo variable.
          NEXT_PUBLIC_DEFAULT_WS_URL: ${{ vars.NEXT_PUBLIC_DEFAULT_WS_URL || 'ws://127.0.0.1:8080/ws' }}
        run: npm run build

      - name: Disable Jekyll on the output
        # Pages applies Jekyll to artifacts by default, which silently drops
        # any file/directory beginning with an underscore (Next.js emits
        # `_next/static/...`). The .nojekyll sentinel suppresses that.
        working-directory: web_dashboard
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_dashboard/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      # The Pages environment is what surfaces the live URL on the workflow
      # summary view (and gates the deployment behind any environment
      # protections the user configures).
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

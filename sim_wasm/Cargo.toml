[package]
name = "sim_wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly wrapper around sim_core for the browser dashboard."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sim_core = { path = "../sim_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
# wasm-bindgen pulls js-sys/web-sys; we only need a small surface for
# `console.error`-style logging from the panic hook.
js-sys = "0.3"
# `getrandom` with the `js` backend so any transitive call (e.g. through
# the noise PRNG seed path) gets a CSPRNG from the browser. The sensor
# noise itself is deterministic on sim_time, but other crates may still
# pull randomness during init.
getrandom = { version = "0.2", features = ["js"] }
